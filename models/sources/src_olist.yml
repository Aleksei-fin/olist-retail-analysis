version: 2

sources:
  - name: raw_olist
    description: Raw Olist source tables loaded into PostgreSQL.
    schema: public
    tables:
      - name: olist_orders_dataset
        description: Order-level transactional data.
        columns:
          - name: order_id
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
          - name: order_purchase_timestamp
            tests:
              - not_null

      - name: olist_order_items_dataset
        description: Item-level order lines.
        columns:
          - name: order_id
            tests:
              - not_null
          - name: order_item_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null

      - name: olist_order_payments_dataset
        description: Payment records at order level, possibly multiple rows per order.
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_value
            tests:
              - not_null

      - name: olist_products_dataset
        description: Product master data.
        columns:
          - name: product_id
            tests:
              - not_null
              - unique

      - name: olist_customers_dataset
        description: Customer master data.
        columns:
          - name: customer_id
            tests:
              - not_null
              - unique

      - name: product_category_name_translation
        description: Translation from original category names to English.
        columns:
          - name: product_category_name
            tests:
              - not_null
              - unique
          - name: product_category_name_english
            tests:
              - not_null
